name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: win-x64
          - os: ubuntu-22.04
            name: linux-x64
          - os: macos-14
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Test the script
        run: python dwsim_dexpi.py tests/synthetic_process.xml -o script.reading.json
      - name: Freeze
        run: pyinstaller --onefile --name dwsim-dexpi --collect-all pydexpi --collect-all resvg dwsim_dexpi.py
      - name: Test the executable
        shell: bash
        run: |
          ./dist/dwsim-dexpi --version
          ./dist/dwsim-dexpi tests/synthetic_process.xml -o frozen.reading.json
          python -c "import json; a = json.load(open('script.reading.json', encoding='utf-8')); b = json.load(open('frozen.reading.json', encoding='utf-8')); assert a['units'] == b['units'] and a['streams'] == b['streams'] and b['overview'], 'the frozen program reads the model differently'"
      - name: Package
        shell: bash
        run: |
          mkdir dwsim-dexpi
          cp dist/dwsim-dexpi* LICENSE README.md dwsim-dexpi/
          if [ "$RUNNER_OS" = "Windows" ]; then 7z a dwsim-dexpi-${{ matrix.name }}.zip dwsim-dexpi; else tar czf dwsim-dexpi-${{ matrix.name }}.tar.gz dwsim-dexpi; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dwsim-dexpi-${{ matrix.name }}
          path: |
            dwsim-dexpi-${{ matrix.name }}.zip
            dwsim-dexpi-${{ matrix.name }}.tar.gz

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dwsim-dexpi-*.zip
            dwsim-dexpi-*.tar.gz
          generate_release_notes: true
